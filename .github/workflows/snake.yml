name: 🐍 Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Gerar animação
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=5865F2&color_dots=%230B0D12,%231B1F2A,%235865F2,%238B5CF6,%2300D9FF
            dist/github-contribution-grid-snake.svg?color_snake=00D9FF&color_dots=%230B0D12,%231B1F2A,%235865F2,%238B5CF6,%2300D9FF

      - name: 🚀 Publicar animação
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
